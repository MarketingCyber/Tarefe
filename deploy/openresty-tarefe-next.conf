# The new Next.js site (Docker stack in /opt/tarefe.de). Added 2026-10-22.
# To undo: delete this file, restore tarefe.conf from /opt/tarefe.de/openresty-backup-*/conf.d, reload.
server {
    listen 443 ssl;
    server_name tarefe.de;

    ssl_certificate     /etc/letsencrypt/live/tarefe.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tarefe.de/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://tarefe-next-web-1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
